<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação de caracteres para acentos e caracteres especiais -->
  <meta charset="UTF-8">
  <title>codeBase - Aula 002: O Bug do Defunto e o Sistema de Cura</title>

  <style>
    /* 1. PALCO E ALINHAMENTO DA PÁGINA */
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* 2. HUD (PLACAR DE STATUS E BOTÕES) */
    #hud {
      margin-bottom: 15px;
      font-size: 1.2rem;
      display: flex;
      gap: 15px;          /* NOVO: Espaçamento automático entre o texto e o botão */
      align-items: center;
    }

    /* NOVO: Estilização do botão de cura */
    #btn-curar {
      background-color: #04d361;
      color: #000000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    /* NOVO: Efeito de 'hover' quando o ponteiro do mouse passa por cima do botão */
    #btn-curar:hover {
      background-color: #00b352;
    }

    /* NOVO: Estilização para quando o botão estiver no estado 'disabled' (desativado) */
    #btn-curar:disabled {
      background-color: #41414d;
      color: #7c7c8a;
      cursor: not-allowed;
    }

    /* 3. A ARENA ONDE O JOGO ACONTECE */
    #arena {
      width: 600px;
      height: 300px;
      background-color: #202024;
      border: 2px solid #41414d;
      position: relative; /* Âncora para posicionar o herói */
      overflow: hidden;
      border-radius: 8px;
    }

    /* 4. O HERÓI (A BOLA SUICIDA) */
    #heroi {
      width: 40px;
      height: 40px;
      background-color: #8257e5;
      border-radius: 50%;
      position: absolute;
      left: 50px;
      bottom: 20px;       /* Posição inicial no chão da arena */
      cursor: pointer;
      transition: bottom 0.1s;
    }
  </style>
</head>
<body>

  <!-- Placar informando o HP e contendo o novo botão de cura -->
  <div id="hud">
    <span>Vida do Herói: <strong id="texto-vida">100</strong> HP</span>
    <!-- NOVO: Botão para recuperar vida chamando a função curarHeroi() -->
    <button id="btn-curar" onclick="curarHeroi()">Usar Poção (+25 HP)</button>
  </div>

  <!-- Arena de jogo contendo o elemento do herói -->
  <div id="arena">
    <div id="heroi" onclick="executarPuloSuicida()"></div>
  </div>

  <script>
    // ESTADO DO JOGO EM VARIÁVEIS
    let vida = 100;
    let maxVida = 100; // NOVO: Limite máximo de vida que o herói pode alcançar
    let posicaoY = 20;

    // Ação do pulo com trava de segurança contra o "Bug do Defunto"
    function executarPuloSuicida() {
      // NOVO: Condicional if (vida > 0) para checar se o herói está vivo antes de pular
      if (vida > 0) {
        let elementoHeroi = document.getElementById("heroi");
        let elementoTextoVida = document.getElementById("texto-vida");

        // 1. Faz o herói subir (Pulo)
        posicaoY = 100;
        elementoHeroi.style.bottom = posicaoY + "px";
        
        // 2. Aplica o dano usando o novo atalho de subtracão (-=)
        vida -= 25;

        // 3. Checa se a vida zerou (Condição de Morte)
        if (vida <= 0) {
          vida = 0;
          elementoHeroi.style.backgroundColor = "#e83f5b"; // Vermelho de derrota
          
          // NOVO: Desativa o botão de cura na interface (.disabled = true)
          document.getElementById("btn-curar").disabled = true;
          alert("☠️ Game Over! O Herói morreu e não pode mais pular nem se curar.");
        }

        // 4. Atualiza a vida na interface
        elementoTextoVida.innerText = vida;

        // 5. Retorna o herói ao chão após 200ms
        setTimeout(function() {
          if (vida > 0) {
            posicaoY = 20;
            elementoHeroi.style.bottom = posicaoY + "px";
          }
        }, 200);

      } else {
        // NOVO: Bloco else para ignorar o clique caso o herói esteja morto
        console.log("🚫 Ação ignorada: O Herói está morto.");
      }
    }

    // NOVA FUNÇÃO: Cura a vida do herói
    function curarHeroi() {
      // NOVO: Uso do operador lógico && (E) para verificar se o herói está vivo E abaixo do HP máximo
      if (vida > 0 && vida < maxVida) {
        vida += 25; // Atalho para: vida = vida + 25

        // Trava para a vida não ultrapassar o teto estipulado em maxVida
        if (vida > maxVida) {
          vida = maxVida;
        }

        // Atualiza o texto na interface e imprime log no console
        document.getElementById("texto-vida").innerText = vida;
        console.log("💚 Herói curado! HP atual: " + vida);
      }
    }
  </script>
</body>
</html>
