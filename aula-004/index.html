<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação de caracteres para acentos e símbolos especiais -->
  <meta charset="UTF-8">
  <title>codeBase - Aula 004: Modularização e Nome do Herói</title>
  
  <!-- NOVO (Aula 004): Conecta a folha de estilos CSS externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NOVO (Aula 004): Painel de Identificação do Jogador (Formulário) -->
  <div id="painel-inicial">
    <label for="input-nome">Nome do Herói:</label>
    <!-- Componente input para leitura de texto do usuário -->
    <input type="text" id="input-nome" placeholder="Digite o nome..." value="Valente">
    <button id="btn-iniciar" onclick="confirmarNome()">Confirmar Nome</button>
  </div>

  <!-- HUD (Placar de Status e Ações) -->
  <div id="hud">
    <!-- NOVO (Aula 004): Rótulo onde exibiremos o nome personalizado retido no JS -->
    <span id="label-heroi">Herói: Valente</span>
    
    <!-- Contêiner gráfico da Barra de Vida CSS -->
    <div id="barra-container">
      <div id="barra-vida"></div>
    </div>
    
    <button id="btn-curar" onclick="curarHeroi()">Usar Poção (+25 HP)</button>
  </div>

  <!-- Arena de jogo contendo o elemento do herói -->
  <div id="arena">
    <div id="heroi" onclick="executarPuloSuicida()"></div>
  </div>

  <!-- NOVO (Aula 004): Importa o arquivo de lógica JS externo no final do body -->
  <script src="script.js"></script>
</body>
</html>
